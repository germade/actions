
name: Github Dispatch Action
description: Trigger a GitHub repository_dispatch event on a target repository.

inputs:
  github-token:
    description: 'GitHub token with repo scope'
    required: false
    default: '${{ github.token }}'
  github-api-version:
    description: 'GitHub API version to use'
    required: false
    default: '2022-11-28'
  github-repository:
    description: 'The target repository in the format "owner/repo"'
    required: false
    default: '${{ github.repository }}'
  event-type:
    description: 'The event type to trigger on the target repository'
    required: true
  client-payload:
    description: 'Optional JSON payload to send with the event'
    required: false
    default: '{}'

runs:
  using: 'composite'
  steps:
    - name: Trigger repository_dispatch event
      shell: bash
      env:
        GH_REPO: ${{ inputs.github-repository }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_API_VERSION: ${{ inputs.github-api-version }}
        EVENT_TYPE: ${{ inputs.event-type }}
        CLIENT_PAYLOAD: ${{ inputs.client-payload }}
      run: |
        PAYLOAD=$(jq -n \
          --arg event_type "$EVENT_TYPE" \
          --argjson client_payload "$CLIENT_PAYLOAD" \
          '{event_type: $event_type, client_payload: $client_payload}')

        response=$(curl -X POST -i \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: $GH_API_VERSION" \
          https://api.github.com/repos/$GH_REPO/dispatches \
          -d "$PAYLOAD")
        
        if [ $? -ne 0 ]; then
          echo "Failed to trigger repository_dispatch event. Response: $response"
          exit 1
        fi

        # handle 4xx responses
        if [[ "$response" == *"HTTP/1.1 4"* ]]; then
          echo "Client error occurred. Response: $response"
          exit 1
        fi

        # handle 5xx responses
        if [[ "$response" == *"HTTP/1.1 5"* ]]; then
          echo "Server error occurred. Response: $response"
          exit 1
        fi

