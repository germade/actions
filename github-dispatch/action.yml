
name: Github Dispatch Action
description: Trigger a GitHub repository_dispatch event on a target repository.

inputs:
  github-token:
    description: 'GitHub token with repo scope'
    required: false
    default: '${{ github.token }}'
  github-api-version:
    description: 'GitHub API version to use'
    required: false
    default: '2022-11-28'
  github-repository:
    description: 'The target repository in the format "owner/repo"'
    required: false
    default: '${{ github.repository }}'
  event-type:
    description: 'The event type to trigger on the target repository'
    required: true
  client-payload:
    description: 'Optional JSON payload to send with the event'
    required: false
    default: '{}'

runs:
  using: 'composite'
  steps:
    - name: Trigger repository_dispatch event
      shell: bash
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ inputs.github-token }}" \
          -H "X-GitHub-Api-Version: ${{ inputs.github-api-version }}" \
          https://api.github.com/repos/${{ inputs.github-repository }}/dispatches \
          -d "{\"event_type\": \"${{ inputs.event-type }}\", \"client_payload\": ${{ inputs.client-payload }}}"