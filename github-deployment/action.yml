
name: GitHub Deploy
description: Create and terminate a GitHub deployment
inputs:
  github-token:
    description: GitHub token with permissions to create deployments
    required: false
    type: string
    default: ${{ github.token }}
    secret: true
  github-api-version:
    description: GitHub API version to use
    required: false
    type: string
    default: 2026-03-10
  deployment-id:
    description: ID of the deployment to update status for (if not creating a new deployment)
    required: false
    type: string
    default: ""
  success:
    description: Whether the deployment was successful
    required: false
    type: boolean
    default: false
  close:
    description: Whether to mark the deployment as inactive (closed)
    required: false
    type: boolean
    default: false
  state:
    description: Custom state for the deployment status (overrides success/close)
    required: false
    type: string
    default: ""
  environment:
    description: Environment name for the deployment
    required: true
    type: string
  target-url:
    description: URL associated with the deployment environment (e.g. preview URL)
    required: false
    type: string
    default: ""
  environment-url:
    description: URL to link in the deployment status (e.g. CI build URL)
    required: false
    type: string
    default: ""
  ref:
    description: Git ref (branch, tag, or commit SHA)
    required: false
    type: string
    default: ${{ github.head_ref || github.ref_name }}
  auto-merge:
    description: Whether to auto-merge the deployment
    required: false
    type: boolean
    default: false
outputs:
  deployment_id:
    description: The ID of the created or reused deployment
    value: ${{ steps.deployment.outputs.deployment_id }}
runs:
  using: composite
  steps:
    - name: Create Deployment
      id: deployment
      shell: bash
      env:
        DEPLOYMENT_ID: ${{ inputs.deployment-id }}
        DEPLOYMENT_REF: ${{ inputs.ref }}
        DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        DEPLOYMENT_TARGET_URL: ${{ inputs.target-url }}
        DEPLOYMENT_AUTO_MERGE: ${{ (inputs.auto-merge == 'true' || inputs.auto-merge == true) && 'true' || 'false' }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_API_VERSION: ${{ inputs.github-api-version }}
      run: |
        if [ -z "$DEPLOYMENT_ID" ]; then
          echo "No deployment ID provided, creating new deployment..."
          payload=$(jq -n \
            --arg ref "$DEPLOYMENT_REF" \
            --arg environment "$DEPLOYMENT_ENVIRONMENT" \
            --argjson auto_merge "$DEPLOYMENT_AUTO_MERGE" \
            --arg description "Deployment for $DEPLOYMENT_ENVIRONMENT environment" \
            --arg target_url "$DEPLOYMENT_TARGET_URL" \
            '{ref: $ref, task: "deploy", environment: $environment, auto_merge: $auto_merge,
              description: $description, target_url: $target_url, auto_inactive: true, required_contexts: []}')

          if ! response=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: $GH_API_VERSION" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments" \
            -d "$payload"); then
            printf 'Failed to create deployment. Response: %s\n' "$response" >&2
            exit 1
          fi

          if ! DEPLOYMENT_ID=$(printf '%s' "$response" | jq -er '.id | select(type == "number" and . > 0)'); then
            printf 'Failed to parse deployment ID. Response: %s\n' "$response" >&2
            exit 1
          fi
        else
          echo "Deployment ID provided, skipping creation..."
        fi

        if ! [[ "$DEPLOYMENT_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "Invalid deployment ID: $DEPLOYMENT_ID" >&2
          exit 1
        fi
        echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
        echo "Deployment ID: $DEPLOYMENT_ID"
    - name: Update Deployment Status
      id: update
      if: steps.deployment.outputs.deployment_id != '' && (inputs.success == true || inputs.success == 'true' || inputs.state != '')
      shell: bash
      run: |
        curl -s -X POST \
          -H "Authorization: token ${{ inputs.github-token }}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: ${{ inputs.github-api-version }}" \
          https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deployment_id }}/statuses \
          -d "{
            \"state\": \"${{ inputs.state != '' && inputs.state || 'success' }}\",
            \"description\": \"Deployment success\",
            \"environment_url\": \"${{ inputs.environment-url || inputs.target-url }}\"
          }"

    - name: Mark Deployment as Inactive
      id: close
      if: steps.deployment.outputs.deployment_id != '' && (inputs.close == true || inputs.close == 'true') && inputs.state == ''
      shell: bash
      run: |
        curl -s -X POST \
          -H "Authorization: token ${{ inputs.github-token }}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: ${{ inputs.github-api-version }}" \
          https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deployment_id }}/statuses \
          -d "{
            \"state\": \"inactive\",
            \"description\": \"Deployment closed\"
          }"
    
